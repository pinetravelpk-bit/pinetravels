<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RX Direct | Admin</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: Inter, system-ui, sans-serif; margin: 0; background: #f4f7fd; color: #0b1f4d; }
      header { background: #0b1f4d; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
      header b { font-size: 18px; }
      main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
      .meta { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
      .body { white-space: pre-wrap; margin: 8px 0; color: #374151; }
      .fields { font-size: 14px; color: #374151; display: flex; flex-wrap: wrap; gap: 4px 18px; }
      button { cursor: pointer; border: 0; border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600; }
      .primary { background: #1d4ed8; color: #fff; }
      .danger { background: #fee2e2; color: #991b1b; }
      .ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); }
      .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
      .tabs button { background: #e5ecfb; color: #0b1f4d; }
      .tabs button.active { background: #1d4ed8; color: #fff; }
      .actions { display: flex; gap: 8px; margin-top: 8px; }
      .empty { color: #6b7280; }
      .pending { display: inline-block; background: #fef3c7; color: #92400e; border-radius: 99px; padding: 1px 8px; font-size: 11px; font-weight: 700; margin-left: 6px; }
      #login { max-width: 360px; margin: 12vh auto; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 10px 30px rgba(11,31,77,.12); }
      #login input { width: 100%; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; margin: 12px 0; }
      #login .err { color: #b91c1c; font-size: 14px; min-height: 20px; }
    </style>
  </head>
  <body>
    <form id="login" hidden>
      <h2 style="margin-top:0">RX Direct Admin</h2>
      <label>Admin password<input type="password" id="pw" autocomplete="current-password" required /></label>
      <div class="err" id="err"></div>
      <button class="primary" style="width:100%">Log in</button>
    </form>

    <div id="app" hidden>
      <header><b>RX Direct Admin</b><button class="ghost" id="logout">Log out</button></header>
      <main>
        <div class="tabs">
          <button data-tab="leads">Leads</button>
          <button data-tab="comments">Blog comments</button>
        </div>
        <div id="panel"></div>
      </main>
    </div>

    <script>
      // Leads from the contact form and blog comments awaiting approval.
      // The password is checked by the API server (ADMIN_PASSWORD) on every
      // request and kept only for this browser tab.
      var API = "/.netlify/functions/";
      var KEY = "rxdirect-admin";
      var pw = sessionStorage.getItem(KEY) || "";
      var tab = location.hash === "#comments" ? "comments" : "leads";
      var $ = function (id) { return document.getElementById(id); };
      function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
      function when(iso) { return new Date(iso).toLocaleString("en-PK", { timeZone: "Asia/Karachi" }); }

      function call(name, opts) {
        opts = opts || {};
        opts.headers = Object.assign({ Authorization: "Bearer " + pw }, opts.headers || {});
        return fetch(API + name, opts).then(function (r) {
          if (r.status === 401) { showLogin("Wrong password."); throw new Error("401"); }
          if (!r.ok) throw new Error("Request failed (" + r.status + ")");
          return r.json();
        });
      }
      function post(name, body) {
        return call(name, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      }

      function showLogin(msg) {
        sessionStorage.removeItem(KEY); pw = "";
        $("app").hidden = true; $("login").hidden = false; $("err").textContent = msg || "";
        $("pw").focus();
      }
      function showApp() { $("login").hidden = true; $("app").hidden = false; render(); }

      function render() {
        document.querySelectorAll(".tabs button").forEach(function (b) { b.classList.toggle("active", b.dataset.tab === tab); });
        history.replaceState(null, "", tab === "comments" ? "#comments" : "#leads");
        $("panel").innerHTML = '<p class="empty">Loading…</p>';
        if (tab === "leads") {
          call("manage-leads").then(function (leads) {
            if (!leads.length) { $("panel").innerHTML = '<p class="empty">No leads yet.</p>'; return; }
            $("panel").innerHTML = leads.map(function (l) {
              return '<div class="card"><div class="meta">' + esc(when(l.createdAt)) + '</div>' +
                '<div class="fields"><span><b>' + esc(l.name) + '</b></span><span>📞 ' + esc(l.phone) + '</span>' +
                (l.city ? '<span>📍 ' + esc(l.city) + '</span>' : '') + (l.service ? '<span>🧑‍🔧 ' + esc(l.service) + '</span>' : '') + '</div>' +
                (l.message ? '<div class="body">' + esc(l.message) + '</div>' : '') +
                '<div class="actions"><a class="primary" style="text-decoration:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px" target="_blank" rel="noopener" href="https://wa.me/' + esc(String(l.phone).replace(/\D/g, "").replace(/^0/, "92")) + '">WhatsApp</a>' +
                '<button class="danger" data-del="' + esc(l.id) + '">Delete</button></div></div>';
            }).join("");
          }).catch(function (e) { if (e.message !== "401") $("panel").innerHTML = '<p class="empty">' + esc(e.message) + '</p>'; });
        } else {
          call("moderate-comments").then(function (list) {
            if (!list.length) { $("panel").innerHTML = '<p class="empty">No comments yet.</p>'; return; }
            $("panel").innerHTML = list.map(function (c) {
              return '<div class="card"><div class="meta">' + esc(when(c.createdAt)) + ' · on <a href="/blog/' + esc(c.pageId) + '" target="_blank">' + esc(c.pageTitle || c.pageId) + '</a>' +
                (c.approved ? '' : '<span class="pending">Pending</span>') + '</div><b>' + esc(c.name) + '</b><div class="body">' + esc(c.text) + '</div>' +
                '<div class="actions">' + (c.approved ? '' : '<button class="primary" data-approve="' + esc(c.id) + '" data-page="' + esc(c.pageId) + '">Approve</button>') +
                '<button class="danger" data-reject="' + esc(c.id) + '" data-page="' + esc(c.pageId) + '">Delete</button></div></div>';
            }).join("");
          }).catch(function (e) { if (e.message !== "401") $("panel").innerHTML = '<p class="empty">' + esc(e.message) + '</p>'; });
        }
      }

      $("panel").addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b) return;
        var done = function () { render(); };
        if (b.dataset.del && confirm("Delete this lead?")) post("manage-leads", { id: b.dataset.del }).then(done);
        if (b.dataset.approve) post("moderate-comments", { pageId: b.dataset.page, id: b.dataset.approve, action: "approve" }).then(done);
        if (b.dataset.reject && confirm("Delete this comment?")) post("moderate-comments", { pageId: b.dataset.page, id: b.dataset.reject, action: "reject" }).then(done);
      });
      document.querySelectorAll(".tabs button").forEach(function (b) { b.onclick = function () { tab = b.dataset.tab; render(); }; });
      $("logout").onclick = function () { showLogin(""); };
      $("login").onsubmit = function (e) {
        e.preventDefault(); pw = $("pw").value; sessionStorage.setItem(KEY, pw); showApp();
      };
      if (pw) showApp(); else showLogin("");
    </script>
  </body>
</html>
